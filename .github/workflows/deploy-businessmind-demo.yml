name: Deploy BusinessMind public demo

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'projects/businessmind-ai/app/**'
      - 'projects/businessmind-ai/preview/**'
      - 'projects/businessmind-ai/scripts/build-demo-preview.mjs'
      - '.github/workflows/deploy-businessmind-demo.yml'

permissions:
  contents: read

concurrency:
  group: businessmind-public-demo
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: projects/businessmind-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/businessmind-ai/package-lock.json
      - run: npm ci
      - name: Verify code and tests
        run: npm run verify
      - name: Build isolated demo
        run: npm run build:demo-preview
      - name: Verify generated demo
        run: |
          test -s dist-demo/index.html
          test -s dist-demo/app.js
          grep -q 'DEMONSTRAÇÃO FICTÍCIA E LOCAL' dist-demo/index.html
          grep -q 'Perguntas abertas sobre a saúde da empresa' dist-demo/app.js
          ! grep -q 'ogypzmxnvjbomamkejkh' dist-demo/app.js
      - name: Check deployment credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }
      - name: Publish all static assets together
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy --name businessmind-ai-demo --assets ./dist-demo --compatibility-date 2026-11-01
      - name: Smoke test public URL
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://businessmind-ai-demo.guisoster060.workers.dev/ -o /tmp/businessmind-demo.html
          grep -q 'BusinessMind' /tmp/businessmind-demo.html
          curl --fail --location --silent --show-error --retry 5 --retry-delay 3 --max-time 20 https://businessmind-ai-demo.guisoster060.workers.dev/app.js -o /tmp/businessmind-demo.js
          grep -q 'Perguntas abertas sobre a saúde da empresa' /tmp/businessmind-demo.js

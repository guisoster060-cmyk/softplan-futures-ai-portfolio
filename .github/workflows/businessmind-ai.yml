name: BusinessMind AI checks

on:
  pull_request:
    paths:
      - 'README.md'
      - 'docs/businessmind-ai/**'
      - 'projects/businessmind-ai/**'
      - '.github/workflows/businessmind-ai.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'README.md'
      - 'docs/businessmind-ai/**'
      - 'projects/businessmind-ai/**'
      - '.github/workflows/businessmind-ai.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/businessmind-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/businessmind-ai/package-lock.json
      - run: npm ci
      - run: npm run verify
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check index.ts index_test.ts
        working-directory: projects/businessmind-ai/supabase/functions/hermes
      - run: deno test --allow-env index_test.ts
        working-directory: projects/businessmind-ai/supabase/functions/hermes

      - name: Build isolated staging preview
        run: npm run build:staging-preview
      - name: Upload staging preview for manual Cloudflare deployment
        uses: actions/upload-artifact@v4
        with:
          name: businessmind-ai-staging-preview
          path: projects/businessmind-ai/dist-staging/
          if-no-files-found: error
          retention-days: 3

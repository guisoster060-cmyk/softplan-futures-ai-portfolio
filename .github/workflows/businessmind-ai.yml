name: BusinessMind AI checks

on:
  pull_request:
    paths:
      - 'projects/businessmind-ai/**'
      - '.github/workflows/businessmind-ai.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'projects/businessmind-ai/**'
      - '.github/workflows/businessmind-ai.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/businessmind-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: projects/businessmind-ai/package-lock.json
      - run: npm ci
      - run: npm run verify
